<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  K-9  ·  by Nyfe
  Minimal front-facing dog-face outline. Brand palette: Midnight #0B1220 + Gold #C08542.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="K-9 by Nyfe">
  <defs>
    <radialGradient id="bg" cx="512" cy="460" r="660" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#172940"/>
      <stop offset="0.5" stop-color="#0F1A2E"/>
      <stop offset="1"   stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="gold" x1="512" y1="200" x2="512" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#EBC079"/>
      <stop offset="0.5" stop-color="#C08542"/>
      <stop offset="1"   stop-color="#9A6733"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="212" fill="url(#bg)"/>

  <g fill="none" stroke="url(#gold)" stroke-width="17"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- head + ears outline (right half, mirrored for the left) -->
    <path id="face" d="M512 306
             C 536 302, 556 302, 576 298
             L 650 210
             C 676 254, 694 318, 702 374
             C 712 434, 706 478, 690 526
             C 670 586, 630 632, 584 668
             C 558 690, 540 706, 528 724
             C 522 733, 518 738, 512 744"/>
    <use href="#face" transform="matrix(-1 0 0 1 1024 0)"/>

    <!-- eyes -->
    <path d="M436 470 C 452 456, 480 456, 496 470 C 480 484, 452 484, 436 470 Z"/>
    <path d="M528 470 C 544 456, 572 456, 588 470 C 572 484, 544 484, 528 470 Z"/>

    <!-- nose -->
    <path d="M486 636 C 486 624, 538 624, 538 636 C 538 654, 512 672, 512 672
             C 512 672, 486 654, 486 636 Z"/>

    <!-- muzzle / mouth -->
    <path d="M512 672 L512 702"/>
    <path d="M512 702 C 502 713, 488 713, 480 707"/>
    <path d="M512 702 C 522 713, 536 713, 544 707"/>
  </g>
</svg>
