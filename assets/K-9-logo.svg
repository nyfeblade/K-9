<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  K-9  ·  by Nyfe
  Angular side-profile sentinel-shepherd, faceted. Original mark.
  Brand palette: Midnight #0B1220 + Gold #C08542.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="K-9 by Nyfe">
  <defs>
    <linearGradient id="gold" x1="210" y1="120" x2="820" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#F0CE8A"/>
      <stop offset="0.45" stop-color="#C08542"/>
      <stop offset="1"    stop-color="#875626"/>
    </linearGradient>
    <linearGradient id="goldLite" x1="210" y1="120" x2="820" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F8DEA4"/>
      <stop offset="1"   stop-color="#D39A50"/>
    </linearGradient>
    <radialGradient id="vig" cx="500" cy="470" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="1"    stop-color="#05080F" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- flat midnight field so the negative-space cuts read as true holes -->
  <rect x="0" y="0" width="1024" height="1024" rx="212" fill="#0B1220"/>
  <rect x="0" y="0" width="1024" height="1024" rx="212" fill="url(#vig)"/>

  <!-- ================= GOLD SILHOUETTE (head + chest, facing left) ========= -->
  <path fill="url(#gold)" d="
    M 210 462 L 232 418 L 330 392 L 430 364 L 486 328
    L 508 248 L 526 204 L 500 96 L 584 214 L 612 244
    L 642 206 L 712 92 L 742 226 L 786 330
    L 822 500 L 800 668 L 724 792 L 585 858
    L 426 856 L 452 690 L 400 588 L 344 520
    L 296 486 L 250 486 Z"/>

  <!-- ================= LIGHTER-GOLD HIGHLIGHT PLANES ====================== -->
  <g fill="url(#goldLite)">
    <!-- top of skull / forehead plane -->
    <path d="M 486 328 L 508 248 L 584 214 L 612 300 L 540 344 Z"/>
    <!-- muzzle bridge highlight -->
    <path d="M 232 418 L 330 392 L 430 364 L 452 396 L 300 448 Z"/>
    <!-- front-of-chest plane -->
    <path d="M 452 690 L 560 702 L 585 858 L 426 856 Z"/>
  </g>

  <!-- ================= MIDNIGHT NEGATIVE-SPACE CUTS ======================= -->
  <g fill="#0B1220">
    <!-- inside of front ear -->
    <path d="M 536 186 L 528 120 L 568 214 L 548 224 Z"/>
    <!-- inside of back ear -->
    <path d="M 652 196 L 706 122 L 728 218 L 676 224 Z"/>
    <!-- eye (angular slit) -->
    <path d="M 432 300 L 488 288 L 472 320 L 434 322 Z"/>
    <!-- brow kerf: forehead plane off the cheek -->
    <path d="M 508 336 L 630 306 L 626 330 L 508 360 Z"/>
    <!-- cheek kerf sweeping back to the jaw -->
    <path d="M 452 396 L 686 352 L 682 386 L 486 452 L 452 430 Z"/>
    <!-- muzzle / mouth line -->
    <path d="M 250 470 L 452 430 L 448 456 L 336 496 L 296 486 L 292 466 Z"/>
    <!-- fang notch -->
    <path d="M 340 480 L 358 480 L 350 508 Z"/>
    <!-- diagonal neck seam (jaw plane vs throat) -->
    <path d="M 500 468 L 700 434 L 762 486 L 596 566 L 540 540 Z"/>
    <!-- chest chevron cut 1 -->
    <path d="M 560 702 L 736 662 L 744 702 L 588 744 Z"/>
    <!-- chest chevron cut 2 -->
    <path d="M 468 762 L 716 722 L 708 766 L 484 802 Z"/>
    <!-- back-neck facet seam -->
    <path d="M 742 306 L 806 476 L 782 486 L 722 322 Z"/>
  </g>
</svg>
